<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jour 9 - Validation de formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-card">
        <h1>Inscription</h1>
        
        <form id="mon-formulaire">
          
            <div class="input-group">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="exemple@domaine.com">
                <small id="erreur-email" class="error-message"></small>
            </div>

           
            <div class="input-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="8 caractères min, 1 chiffre, 1 majuscule">
                <small id="erreur-password" class="error-message"></small>
            </div>

         
            <button type="submit">S'inscrire</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
